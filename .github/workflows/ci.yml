name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: sonavra
          POSTGRES_USER: sonavra
          POSTGRES_PASSWORD: sonavra
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sonavra -d sonavra"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://sonavra:sonavra@localhost:5432/sonavra
      STORAGE_INTEGRATION: '1'
      S3_ENDPOINT: http://127.0.0.1:9000
      S3_PUBLIC_ENDPOINT: http://127.0.0.1:9000
      S3_BUCKET: sonavra
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: sonavra
      S3_SECRET_ACCESS_KEY: sonavra-local-secret

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start S3-compatible storage
        run: |
          docker run -d --name sonavra-object-storage -p 9000:9000 \
            -e AWS_ACCESS_KEY_ID="$S3_ACCESS_KEY_ID" \
            -e AWS_SECRET_ACCESS_KEY="$S3_SECRET_ACCESS_KEY" \
            chrislusf/seaweedfs@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d server -dir=/data -s3 -s3.port=9000
          pnpm storage:setup

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Apply database migrations
        run: pnpm db:deploy

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check
