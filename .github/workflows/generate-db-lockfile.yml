name: Generate database lockfile
on:
  pull_request:
permissions:
  contents: read
jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: corepack enable
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: pnpm install --lockfile-only --no-frozen-lockfile
      - run: cat pnpm-lock.yaml
