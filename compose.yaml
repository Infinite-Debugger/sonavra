services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sonavra}
      POSTGRES_USER: ${POSTGRES_USER:-sonavra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sonavra}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - sonavra-postgres-data:/var/lib/postgresql
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-sonavra} -d ${POSTGRES_DB:-sonavra}',
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  object-storage:
    image: chrislusf/seaweedfs@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    command: server -dir=/data -s3 -s3.port=9000
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-sonavra}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-sonavra-local-secret}
    ports:
      - '${S3_PORT:-9000}:9000'
    volumes:
      - sonavra-object-storage-data:/data
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '-q',
          '--spider',
          'http://localhost:9333/cluster/status',
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sonavra-postgres-data:
  sonavra-object-storage-data:
